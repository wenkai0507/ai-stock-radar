-items:center;gap:10px;margin-bottom:12px}.section-head h2,.card h3{margin:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:2400px;font-size:12px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}th{background:#f8fafc;position:sticky;top:0;z-index:2}th:first-child,td:first-child{text-align:left}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.badge.g{background:#dcfae6;color:var(--g)}.badge.y{background:#fef0c7;color:var(--y)}.badge.o{background:#ffead5;color:var(--o)}.badge.r{background:#fee4e2;color:var(--r)}.badge.b{background:#e0edff;color:var(--b)}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 0 2px rgba(0,0,0,.08)}.dot.green{background:#12b76a}.dot.yellow{background:#fdb022}.dot.orange{background:#f79009}.dot.red{background:#f04438}.dot.blue{background:#2e90fa}.dot.gray{background:#98a2b3}.conclusion{display:flex;align-items:center;gap:0}.up{color:var(--g);font-weight:700}.down{color:var(--r);font-weight:700}.flat{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stockcard{border:1px solid var(--line);border-radius:12px;padding:14px}.stock-title{display:flex;justify-content:space-between;gap:8px}.stock-title span,.stockcard small{color:var(--muted)}.score{font-size:30px;font-weight:800;margin:8px 0}.score small{font-size:12px;font-weight:500}.stockcard p{font-size:13px;color:var(--muted);line-height:1.6}.spark{width:100%;height:55px;color:#2563eb}.hero{background:linear-gradient(135deg,#fff,#edf5ff);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:15px}.hero h2{font-size:25px;margin:5px 0}.hero p{color:var(--muted);max-width:760px;line-height:1.7}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--blue);font-
